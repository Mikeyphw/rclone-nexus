# Copy to /data/adb/rclone-nexus/mounts.d/drive.conf
enabled=true
remote=gdrive:
mountpoint=/storage/emulated/0/Rclone/Drive
vfs_cache_mode=full
allow_other=true
log_level=INFO
# args_file=drive.args

