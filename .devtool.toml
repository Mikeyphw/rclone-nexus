# Build-time runtime input authority. This target owns network/source acquisition
# and Android bclone compilation; it never mutates installed runtime state.
[targets.rclone_runtime_inputs]
runner = "command"
platform = "cli"
root = "."
execution_environment = "auto"
inputs = ["scripts/dev/runtime_inputs.py", "scripts/dev/runtime_source_build.py", "scripts/dev/source_g1_device.py", "tests/test_runtime_inputs.py", ".devtool.toml"]
outputs = ["build/runtime/**"]

[targets.rclone_runtime_inputs.jobs.contract]
runner = "command"
command = ["python3", "-m", "pytest", "-q", "tests/test_runtime_inputs.py"]
inputs = ["scripts/dev/runtime_inputs.py", "scripts/dev/runtime_source_build.py", "tests/test_runtime_inputs.py"]
metadata = { read_only = true, campaign = "runtime-inputs", gate = "contract" }

[targets.rclone_runtime_inputs.jobs.newfuture]
runner = "command"
command = ["python3", "scripts/dev/runtime_inputs.py", "materialize", "--provider", "newfuture", "--output-dir", "build/runtime/newfuture"]
inputs = ["scripts/dev/runtime_inputs.py"]
outputs = ["build/runtime/newfuture/**"]
metadata = { read_only = false, transaction_root_aware = true, campaign = "runtime-inputs", provider = "newfuture", fuse_helper = "newfuture" }

[targets.rclone_runtime_inputs.jobs.bclone]
runner = "command"
command = ["python3", "scripts/dev/runtime_inputs.py", "materialize", "--provider", "bclone", "--output-dir", "build/runtime/bclone"]
inputs = ["scripts/dev/runtime_inputs.py", "scripts/dev/runtime_source_build.py", "scripts/dev/source_g1_device.py"]
outputs = ["build/runtime/bclone/**"]
metadata = { read_only = false, transaction_root_aware = true, campaign = "runtime-inputs", provider = "bclone", fuse_helper = "newfuture" }

[targets.rclone_runtime_inputs.jobs.verify-newfuture]
runner = "command"
command = ["python3", "scripts/dev/runtime_inputs.py", "verify", "--runtime-dir", "build/runtime/newfuture"]
inputs = ["build/runtime/newfuture/**", "scripts/dev/runtime_inputs.py"]
metadata = { read_only = true, campaign = "runtime-inputs", gate = "verify-newfuture" }

[targets.rclone_runtime_inputs.jobs.verify-bclone]
runner = "command"
command = ["python3", "scripts/dev/runtime_inputs.py", "verify", "--runtime-dir", "build/runtime/bclone"]
inputs = ["build/runtime/bclone/**", "scripts/dev/runtime_inputs.py"]
metadata = { read_only = true, campaign = "runtime-inputs", gate = "verify-bclone" }

[targets.rclone_runtime_inputs.workflows]
validate = [
  { id = "contract", ref = "job:contract", depends_on = [] },
]
newfuture = [
  { id = "contract", ref = "job:contract", depends_on = [] },
  { id = "materialize", ref = "job:newfuture", depends_on = ["contract"] },
  { id = "verify", ref = "job:verify-newfuture", depends_on = ["materialize"] },
]
bclone = [
  { id = "contract", ref = "job:contract", depends_on = [] },
  { id = "materialize", ref = "job:bclone", depends_on = ["contract"] },
  { id = "verify", ref = "job:verify-bclone", depends_on = ["materialize"] },
]

# Static-runtime convergence is a target-local EXO campaign.  It intentionally
# does not depend on the historical mutable-runtime qualification workflows above.
# Those workflows remain as provenance for old release evidence, while this target
# is the current product authority for the bundled singular runtime.
[targets.rclone_static_runtime]
runner = "command"
platform = "cli"
root = "."
execution_environment = "auto"
inputs = [".devtool.toml", "go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/**", "tests/test_static_runtime_product_surface.py", "README.md", "docs/ARCHITECTURE.md", "docs/STATIC_RUNTIME_BUILD.md", "docs/campaign/STATIC_RUNTIME_FINALIZATION.md", "scripts/dev/check_static_runtime_ux.mjs"]
[targets.rclone_static_runtime.jobs.surface-contract]
runner = "command"
command = ["python3", "-m", "pytest", "-q", "tests/test_static_runtime_product_surface.py"]
inputs = ["tests/test_static_runtime_product_surface.py", ".devtool.toml", "cmd/**", "internal/**", "module/**", "scripts/dev/**", "README.md", "docs/ARCHITECTURE.md", "docs/STATIC_RUNTIME_BUILD.md"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "surface" }

[targets.rclone_static_runtime.jobs.go-authority]
runner = "command"
command = ["go", "test", "-count=1", "./cmd/racctl", "./internal/runtimeauth", "./internal/provider", "./internal/control", "./internal/migration"]
inputs = ["go.mod", "cmd/racctl/**", "internal/runtimeauth/**", "internal/provider/**", "internal/control/**", "internal/migration/**", "internal/paths/**"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "authority" }

[targets.rclone_static_runtime.jobs.shell-syntax]
runner = "command"
command = ["sh", "scripts/dev/check-shell-syntax.sh"]
inputs = ["module/**/*.sh", "module/system/bin/**", "scripts/**/*.sh", "tests/**/*.sh"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "syntax" }

[targets.rclone_static_runtime.jobs.module-contract]
runner = "command"
command = ["python3", "scripts/dev/check-module-contract.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "examples/**", "scripts/dev/check-module-contract.py", "scripts/dev/package_module.py"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "module-contract" }

[targets.rclone_static_runtime.jobs.go-repository]
runner = "command"
command = ["go", "test", "-count=1", "./..."]
inputs = ["go.mod", "cmd/**", "internal/**"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "repository" }

[targets.rclone_static_runtime.jobs.package-contract]
runner = "command"
command = ["python3", "scripts/dev/check-package.py", "--ephemeral"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/build_racctl.py", "scripts/dev/package_module.py", "scripts/dev/check-package.py"]
metadata = { read_only = true, transaction_root_aware = true, campaign = "static-runtime-finalization", gate = "package" }

[targets.rclone_static_runtime.jobs.artifact-audit]
runner = "command"
command = ["python3", "scripts/dev/static_runtime_final_gate.py"]
inputs = [".devtool.toml", "go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/**", "tests/test_static_runtime_product_surface.py", "README.md", "docs/ARCHITECTURE.md", "docs/STATIC_RUNTIME_BUILD.md", "docs/campaign/STATIC_RUNTIME_FINALIZATION.md"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "artifact-seal" }

[targets.rclone_static_runtime.jobs.final-audit]
runner = "command"
command = ["python3", "scripts/dev/static_runtime_final_gate.py"]
inputs = [".devtool.toml", "go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/**", "tests/test_static_runtime_product_surface.py", "README.md", "docs/ARCHITECTURE.md", "docs/STATIC_RUNTIME_BUILD.md", "docs/campaign/STATIC_RUNTIME_FINALIZATION.md"]
metadata = { read_only = true, campaign = "static-runtime-finalization", gate = "final-seal" }

[targets.rclone_static_runtime.jobs.webui-static]
runner = "command"
command = ["node", "scripts/dev/check_static_runtime_ux.mjs"]
inputs = ["module/webroot/app.js", "module/webroot/model.js", "module/webroot/index.html", "module/webroot/style.css", "scripts/dev/check_static_runtime_ux.mjs"]
metadata = {read_only = true, campaign = "static-runtime-finalization", gate = "webui-static"}
[targets.rclone_static_runtime.workflows]
quick = [
    {id = "surface", ref = "job:surface-contract", depends_on = []},
    {id = "authority", ref = "job:go-authority", depends_on = []},
    {id = "webui-static", ref = "job:webui-static", depends_on = []},
    {id = "module", ref = "job:module-contract", depends_on = []},
]
artifact-seal = [
    {id = "surface", ref = "job:surface-contract", depends_on = []},
    {id = "authority", ref = "job:go-authority", depends_on = []},
    {id = "webui-static", ref = "job:webui-static", depends_on = []},
    {id = "shell-syntax", ref = "job:shell-syntax", depends_on = []},
    {id = "module-contract", ref = "job:module-contract", depends_on = []},
    {id = "repository", ref = "job:go-repository", depends_on = ["authority"]},
    {id = "seal", ref = "job:artifact-audit", depends_on = ["surface", "webui-static", "repository", "shell-syntax", "module-contract"]},
]
final-seal = [
    {id = "surface", ref = "job:surface-contract", depends_on = []},
    {id = "authority", ref = "job:go-authority", depends_on = []},
    {id = "webui-static", ref = "job:webui-static", depends_on = []},
    {id = "shell-syntax", ref = "job:shell-syntax", depends_on = []},
    {id = "module-contract", ref = "job:module-contract", depends_on = []},
    {id = "repository", ref = "job:go-repository", depends_on = ["authority"]},
    {id = "package", ref = "job:package-contract", depends_on = ["repository", "shell-syntax", "module-contract"]},
    {id = "seal", ref = "job:final-audit", depends_on = ["surface", "webui-static", "package"]},
]


# Atomic overlay validation intentionally uses feature-scoped first-class TestSpecs
# rather than nesting workflow:artifact-seal inside apply-overlay. The complete
# repository suite remains a required EXO go-repository stage after application;
# keeping it outside the open mutation transaction prevents unrelated teardown or
# environment flakes from rolling back a correctly validated runtime migration.
[[test]]
id = "runtime-inputs-artifact-contract"
name = "Runtime provider and NewFuture FUSE helper build-time contract"
runner = "pytest"
timeout_seconds = 120
command = ["python3", "-m", "pytest", "-q", "tests/test_runtime_inputs.py"]

[[test]]
id = "static-runtime-artifact-surface"
name = "Static runtime artifact product-surface contract"
runner = "pytest"
timeout_seconds = 120
command = ["python3", "-m", "pytest", "-q", "tests/test_static_runtime_product_surface.py"]

[[test]]
id = "static-runtime-artifact-authority"
name = "Static runtime artifact authority contract"
runner = "go"
timeout_seconds = 180
command = ["go", "test", "-count=1", "./cmd/racctl", "./internal/runtimeauth", "./internal/provider", "./internal/control", "./internal/migration"]

[[test]]
id = "static-runtime-artifact-webui"
name = "Static runtime artifact WebUI contract"
runner = "node"
timeout_seconds = 60
command = ["node", "scripts/dev/check_static_runtime_ux.mjs"]

[[test]]
id = "static-runtime-artifact-module"
name = "Static runtime artifact module contract"
runner = "python"
timeout_seconds = 120
command = ["python3", "scripts/dev/check-module-contract.py"]


[[test]]
id = "static-runtime-artifact-audit"
name = "Static runtime artifact final source audit"
runner = "python"
timeout_seconds = 60
command = ["python3", "scripts/dev/static_runtime_final_gate.py"]
