command = ["python3", "scripts/dev/grand_g1_gate.py"]
inputs = [".devtool.toml", "go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/**", "tests/**", "README.md", "CHANGELOG.md", "docs/**", "release/final-seal-policy.json", "release/roadmap-requirements.json", "release/evidence/README.md", "release/evidence/schema-v3.json"]
outputs = ["dist/release-verdict.json"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.package]
