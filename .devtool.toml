runner = "command"
command = ["python3", "scripts/dev/check_device_runtime_webui_remediation.py"]
inputs = ["internal/provider/**", "internal/readiness/**", "internal/diagnostics/**", "internal/mounts/**", "internal/supervisor/**", "internal/control/**", "module/**", "scripts/dev/check_device_runtime_webui_remediation.py", "scripts/dev/install_stack.py", "tests/test_install_stack.py", "docs/GRAND_G1_DEVICE_RUNTIME_WEBUI_REMEDIATION_AUDIT.md"]
