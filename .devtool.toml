[project]
runner = "command"
platform = "cli"

[workspace]
default_target = "rclone_nexus"

# Repository wrapper is only a frontend over canonical Devtool workflows.
[wrapper]
schema = 2
default_command = "validate"

[wrapper.commands.validate]
description = "Run the canonical repository validation workflow"
workflow = "validate"
target = "rclone_nexus"

[wrapper.commands.test]
description = "Run the Rclone Nexus unit/integration tests"
workflow = "test"
target = "rclone_nexus"

[wrapper.commands.build]
description = "Validate and build the flashable root-module zip"
workflow = "package"
target = "rclone_nexus"

[wrapper.commands.release]
description = "Run release qualification and build the module artifact"
workflow = "release"
target = "rclone_nexus"

[wrapper.commands.core-g1]
description = "Run the CORE-G1 control-plane/lifecycle qualification gate"
workflow = "core-g1"
target = "rclone_nexus"

[execution]
environment = "auto"
chroot_name = "androidos"

[targets.rclone_nexus]
runner = "command"
platform = "cli"
root = "."
execution_environment = "native-termux"
inputs = [
  ".devtool.toml",
  "go.mod",
  "cmd/**",
  "internal/**",
  "module/**",
  "scripts/**",
  "tests/**",
  "examples/**",
  "README.md",
  "docs/**",
]
outputs = ["build/**", "dist/**"]


[targets.rclone_nexus.jobs.go-test]
runner = "command"
command = ["go", "test", "./..."]
inputs = ["go.mod", "cmd/**", "internal/**"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.racctl-android]
runner = "command"
command = ["python3", "scripts/dev/build_racctl.py", "--abi", "arm64-v8a", "--verify-reproducible"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/module.prop", "scripts/dev/build_racctl.py"]
outputs = ["build/android/arm64-v8a/racctl"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.shell-syntax]
runner = "command"
command = ["sh", "scripts/dev/check-shell-syntax.sh"]
inputs = ["module/**/*.sh", "module/system/bin/**", "scripts/**/*.sh", "tests/**/*.sh"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.module-contract]
runner = "command"
command = ["python3", "scripts/dev/check-module-contract.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "examples/**", "scripts/dev/check-module-contract.py"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.unit-tests]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py", "-v"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "tests/**", "scripts/dev/build_racctl.py"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.core-g1-audit]
runner = "command"
command = ["python3", "scripts/dev/core_g1_gate.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/core_g1_gate.py", "docs/implementation/CORE-X01.md", "docs/implementation/LIFE-X01.md", "docs/implementation/LIFE-X02.md"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.package]
runner = "command"
command = ["python3", "scripts/dev/package_module.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/build_racctl.py", "scripts/dev/package_module.py"]
outputs = ["dist/rclone-nexus-v0.1.0-dev.zip"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.package-contract]
runner = "command"
command = ["python3", "scripts/dev/check-package.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/build_racctl.py", "scripts/dev/package_module.py", "scripts/dev/check-package.py"]
outputs = ["dist/rclone-nexus-v0.1.0-dev.zip"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.workflows]
validate = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
]
test = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "go-tests"] },
]
package = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package", ref = "job:package", depends_on = ["compat-tests", "racctl-android"] },
]
release = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["compat-tests", "racctl-android"] },
]
core-g1 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "gate-audit", ref = "job:core-g1-audit", depends_on = ["compat-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["gate-audit", "racctl-android"] },
]
