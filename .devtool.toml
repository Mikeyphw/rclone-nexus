metadata = { read_only = false, transaction_root_aware = true, runtime_provider = "newfuture", fuse_helper = "newfuture" }

[targets.rclone_nexus.jobs.release-artifacts-bclone]
runner = "command"
command = ["python3", "scripts/dev/release_artifacts.py", "--runtime-dir", "build/runtime/bclone"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "build/runtime/bclone/**", "scripts/dev/build_racctl.py", "scripts/dev/runtime_inputs.py", "scripts/dev/package_module.py", "scripts/dev/release_artifacts.py", "README.md", "CHANGELOG.md", "docs/**"]
outputs = ["dist/rclone-nexus-v0.1.0.zip", "dist/SHA256SUMS", "dist/release-manifest.json"]
