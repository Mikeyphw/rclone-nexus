outputs = ["dist/rclone-nexus-v0.1.0.zip", "dist/SHA256SUMS", "dist/release-manifest.json"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.release-device-evidence]
runner = "command"
command = ["python3", "scripts/dev/release_device_qualification.py", "capture"]
inputs = ["scripts/dev/release_device_qualification.py", "release/evidence/README.md", "release/evidence/schema-v3.json"]
