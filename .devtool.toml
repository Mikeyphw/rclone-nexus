[targets.rclone_nexus.jobs.release-failure-injection]
runner = "command"
command = ["python3", "scripts/dev/release_failure_injection.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "scripts/dev/release_failure_injection.py"]
