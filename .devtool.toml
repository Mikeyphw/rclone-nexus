[targets.rclone_nexus.jobs.rel-x01-audit]
runner = "command"
command = ["python3", "scripts/dev/rel_x01_gate.py"]
inputs = ["module/module.prop", "internal/buildinfo/**", "module/webroot/**", "scripts/dev/rel_x01_gate.py", "scripts/dev/release_artifacts.py", "scripts/dev/check_release.py", "scripts/dev/release_failure_injection.py", "scripts/dev/release_device_qualification.py", "README.md", "CHANGELOG.md", "docs/ROADMAP.md", "docs/release/**", "release/evidence/README.md", "release/evidence/schema-v3.json"]
