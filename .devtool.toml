[project]
runner = "command"
platform = "cli"

[workspace]
default_target = "rclone_nexus"

# Repository wrapper is only a frontend over canonical Devtool workflows.
[wrapper]
schema = 2
default_command = "validate"

[wrapper.commands.validate]
description = "Run the canonical repository validation workflow"
workflow = "validate"
target = "rclone_nexus"

[wrapper.commands.test]
description = "Run the Rclone Nexus unit/integration tests"
workflow = "test"
target = "rclone_nexus"

[wrapper.commands.build]
description = "Validate and build the flashable root-module zip"
workflow = "package"
target = "rclone_nexus"

[wrapper.commands.release]
description = "Run release qualification and build the module artifact"
workflow = "release"
target = "rclone_nexus"

[wrapper.commands.core-g1]
description = "Run the CORE-G1 control-plane/lifecycle qualification gate"
workflow = "core-g1"
target = "rclone_nexus"


[wrapper.commands.policy-x01]
description = "Run POLICY-X01 resource-policy and VFS/cache validation"
workflow = "policy-x01"
target = "rclone_nexus"

[wrapper.commands.runtime-x01]
description = "Run RUNTIME-X01 jobs and local RC validation"
workflow = "runtime-x01"
target = "rclone_nexus"

[wrapper.commands.android-g1]
description = "Run the ANDROID-G1 Android/runtime qualification gate"
workflow = "android-g1"
target = "rclone_nexus"


[wrapper.commands.platform-x01]
description = "Run PLATFORM-X01 diagnostics/root-portability validation"
workflow = "platform-x01"
target = "rclone_nexus"

[wrapper.commands.platform-g1]
description = "Run the PLATFORM-G1 diagnostics/portability qualification gate"
workflow = "platform-g1"
target = "rclone_nexus"

[wrapper.commands.webui]
description = "Run WebUI JavaScript syntax and typed-client contract validation in the configured chroot"
workflow = "validate"
target = "rclone_webui"

[wrapper.commands.web-x01]
description = "Run WEB-X01 native transport and static-security validation"
workflow = "web-x01"
target = "rclone_nexus"

[wrapper.commands.device-smoke]
description = "Inspect Android namespace visibility and optionally run a controlled propagation smoke"
workflow = "device-smoke"
target = "rclone_nexus"

[execution]
environment = "auto"
chroot_name = "androidos"

[targets.rclone_nexus]
runner = "command"
platform = "cli"
root = "."
execution_environment = "native-termux"
inputs = [
  ".devtool.toml",
  "go.mod",
  "cmd/**",
  "internal/**",
  "module/**",
  "scripts/**",
  "tests/**",
  "examples/**",
  "README.md",
  "docs/**",
]
outputs = ["build/**", "dist/**"]


[targets.rclone_nexus.jobs.go-test]
runner = "command"
command = ["go", "test", "./..."]
inputs = ["go.mod", "cmd/**", "internal/**"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.racctl-android]
runner = "command"
command = ["python3", "scripts/dev/build_racctl.py", "--abi", "arm64-v8a", "--verify-reproducible"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/module.prop", "scripts/dev/build_racctl.py"]
outputs = ["build/android/arm64-v8a/racctl"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.shell-syntax]
runner = "command"
command = ["sh", "scripts/dev/check-shell-syntax.sh"]
inputs = ["module/**/*.sh", "module/system/bin/**", "scripts/**/*.sh", "tests/**/*.sh"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.module-contract]
runner = "command"
command = ["python3", "scripts/dev/check-module-contract.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "examples/**", "scripts/dev/check-module-contract.py"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.unit-tests]
runner = "command"
command = ["python3", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py", "-v"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "tests/**", "scripts/dev/build_racctl.py"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.core-g1-audit]
runner = "command"
command = ["python3", "scripts/dev/core_g1_gate.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/core_g1_gate.py", "docs/implementation/CORE-X01.md", "docs/implementation/LIFE-X01.md", "docs/implementation/LIFE-X02.md"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.namespace-tests]
runner = "command"
command = ["go", "test", "-count=1", "./internal/namespace"]
inputs = ["go.mod", "internal/namespace/**", "internal/mounts/**", "internal/paths/**"]
metadata = { read_only = true }


[targets.rclone_nexus.jobs.policy-tests]
runner = "command"
command = ["go", "test", "-count=1", "./internal/policy", "./internal/vfs", "./internal/cache", "./internal/mounts", "./internal/supervisor", "./internal/control"]
inputs = ["go.mod", "internal/policy/**", "internal/vfs/**", "internal/cache/**", "internal/mounts/**", "internal/supervisor/**", "internal/control/**", "internal/paths/**"]
metadata = { read_only = true }


[targets.rclone_nexus.jobs.runtime-tests]
runner = "command"
command = ["go", "test", "-count=1", "./internal/jobs", "./internal/rc", "./internal/daemon", "./internal/mounts", "./internal/control"]
inputs = ["go.mod", "internal/jobs/**", "internal/rc/**", "internal/daemon/**", "internal/mounts/**", "internal/control/**", "internal/journal/**", "internal/policy/**", "internal/paths/**"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.android-g1-audit]
runner = "command"
command = ["python3", "scripts/dev/android_g1_gate.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/android_g1_gate.py", "docs/ROADMAP.md", "docs/implementation/ANDROID-X01.md", "docs/implementation/POLICY-X01.md", "docs/implementation/RUNTIME-X01.md", "docs/implementation/ANDROID-G1.md"]
metadata = { read_only = true }


[targets.rclone_nexus.jobs.platform-tests]
runner = "command"
command = ["go", "test", "-count=1", "./internal/rootmgr", "./internal/diagnostics", "./internal/doctor", "./internal/integrity", "./internal/platformstate", "./internal/platformlifecycle", "./internal/control", "./internal/supervisor"]
inputs = ["go.mod", "internal/rootmgr/**", "internal/diagnostics/**", "internal/doctor/**", "internal/integrity/**", "internal/platformstate/**", "internal/platformlifecycle/**", "internal/control/**", "internal/supervisor/**", "internal/paths/**"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.platform-x01-audit]
runner = "command"
command = ["python3", "scripts/dev/platform_x01_gate.py"]
inputs = ["module/**", "scripts/dev/platform_x01_gate.py", "scripts/dev/package_module.py", "scripts/dev/check-package.py", "docs/ROADMAP.md", "docs/implementation/PLATFORM-X01.md"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.platform-g1-audit]
runner = "command"
command = ["python3", "scripts/dev/platform_g1_gate.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/platform_x01_gate.py", "scripts/dev/platform_g1_gate.py", "scripts/dev/package_module.py", "scripts/dev/check-package.py", "docs/ROADMAP.md", "docs/implementation/PLATFORM-X01.md", "docs/implementation/PLATFORM-G1.md"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.namespace-device-smoke]
runner = "command"
command = ["python3", "scripts/dev/android_namespace_device_smoke.py"]
inputs = ["scripts/dev/android_namespace_device_smoke.py", "internal/namespace/**", "cmd/racctl/main.go"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.webui-tests]
runner = "command"
command = ["go", "test", "-count=1", "./internal/webui", "./internal/control", "./cmd/racctl"]
inputs = ["go.mod", "internal/webui/**", "internal/control/**", "internal/daemon/**", "internal/protocol/**", "internal/paths/**", "cmd/racctl/**"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.web-x01-audit]
runner = "command"
command = ["python3", "scripts/dev/web_x01_gate.py"]
inputs = ["go.mod", "cmd/**", "internal/webui/**", "internal/control/**", "module/webroot/**", "module/action.sh", "scripts/dev/web_x01_gate.py", "docs/ROADMAP.md", "docs/implementation/WEB-X01.md"]
metadata = { read_only = true }

[targets.rclone_nexus.jobs.package]
runner = "command"
command = ["python3", "scripts/dev/package_module.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/build_racctl.py", "scripts/dev/package_module.py"]
outputs = ["dist/rclone-nexus-v0.1.0-dev.zip"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.package-contract]
runner = "command"
command = ["python3", "scripts/dev/check-package.py"]
inputs = ["go.mod", "cmd/**", "internal/**", "module/**", "scripts/dev/build_racctl.py", "scripts/dev/package_module.py", "scripts/dev/check-package.py"]
outputs = ["dist/rclone-nexus-v0.1.0-dev.zip"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.workflows]
validate = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
]
test = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "go-tests"] },
]
package = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package", ref = "job:package", depends_on = ["compat-tests", "racctl-android"] },
]
release = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["compat-tests", "racctl-android"] },
]
core-g1 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "gate-audit", ref = "job:core-g1-audit", depends_on = ["compat-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["gate-audit", "racctl-android"] },
]

policy-x01 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "policy-tests", ref = "job:policy-tests", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "policy-tests"] },
]


runtime-x01 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "runtime-tests", ref = "job:runtime-tests", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "runtime-tests"] },
]

android-g1 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "gate-audit", ref = "job:android-g1-audit", depends_on = ["compat-tests"] },
  { id = "device-observe", ref = "job:namespace-device-smoke", depends_on = ["gate-audit"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["gate-audit", "device-observe", "racctl-android"] },
]


platform-x01 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "platform-tests", ref = "job:platform-tests", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "platform-tests"] },
  { id = "platform-audit", ref = "job:platform-x01-audit", depends_on = ["compat-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["platform-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["platform-audit", "racctl-android"] },
]

platform-g1 = [
  { id = "syntax", ref = "job:shell-syntax", depends_on = [] },
  { id = "contract", ref = "job:module-contract", depends_on = [] },
  { id = "go-tests", ref = "job:go-test", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["syntax", "contract", "go-tests"] },
  { id = "gate-audit", ref = "job:platform-g1-audit", depends_on = ["compat-tests"] },
  { id = "racctl-android", ref = "job:racctl-android", depends_on = ["go-tests"] },
  { id = "package-contract", ref = "job:package-contract", depends_on = ["gate-audit", "racctl-android"] },
]

web-x01 = [
  { id = "webui-tests", ref = "job:webui-tests", depends_on = [] },
  { id = "compat-tests", ref = "job:unit-tests", depends_on = ["webui-tests"] },
  { id = "web-audit", ref = "job:web-x01-audit", depends_on = ["compat-tests"] },
]

device-smoke = [
  { id = "namespace-tests", ref = "job:namespace-tests", depends_on = [] },
  { id = "device", ref = "job:namespace-device-smoke", depends_on = ["namespace-tests"] },
]

[targets.rclone_webui]
runner = "command"
platform = "cli"
root = "."
execution_environment = "chroot"
chroot_name = "androidos"
inputs = ["module/webroot/**", "scripts/dev/check_webui_js.mjs", "scripts/dev/web_x01_gate.py", "docs/implementation/WEB-X01.md"]

[targets.rclone_webui.jobs.js-contract]
runner = "command"
command = ["node", "scripts/dev/check_webui_js.mjs"]
inputs = ["module/webroot/**", "scripts/dev/check_webui_js.mjs"]
metadata = { read_only = true }

[targets.rclone_webui.jobs.static-audit]
runner = "command"
command = ["python3", "scripts/dev/web_x01_gate.py"]
inputs = ["module/webroot/**", "module/action.sh", "internal/webui/**", "cmd/racctl/**", "scripts/dev/web_x01_gate.py", "docs/implementation/WEB-X01.md"]
metadata = { read_only = true }

[targets.rclone_webui.workflows]
validate = [
  { id = "js-contract", ref = "job:js-contract", depends_on = [] },
  { id = "static-audit", ref = "job:static-audit", depends_on = [] },
]
