command = ["python3", "scripts/dev/install_stack.py", "install", "--nexus-zip", "dist/rclone-nexus-v0.1.0.zip"]
inputs = ["scripts/dev/install_stack.py", "dist/rclone-nexus-v0.1.0.zip"]
metadata = { read_only = false, transaction_root_aware = true }

[targets.rclone_nexus.jobs.install-complete-stack]
