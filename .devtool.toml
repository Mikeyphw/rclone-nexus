[targets.rclone_nexus.jobs.guided-mount-remediation-audit]
runner = "command"
command = ["python3", "scripts/dev/check_webui_mount_editor.py"]
inputs = ["module/webroot/**", "internal/cache/**", "internal/control/**", "internal/mounts/**", "scripts/dev/check_webui_mount_editor.py", "scripts/dev/check_webui_mount_editor.mjs", "docs/WEBUI_MOUNT_PROMISE_AUDIT.md"]
