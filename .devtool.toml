[targets.rclone_nexus.jobs.release-device-validate]
runner = "command"
command = ["python3", "scripts/dev/release_device_qualification.py", "validate", "--require-complete"]
inputs = ["scripts/dev/release_device_qualification.py", "release/evidence/README.md", "release/evidence/schema-v3.json"]
