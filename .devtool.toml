[targets.rclone_nexus.jobs.webui-final-contract]
runner = "command"
command = ["node", "scripts/dev/check_webui_final.mjs"]
execution_environment = "chroot"
chroot_name = "androidos"
inputs = ["module/webroot/**", "scripts/dev/check_webui_js.mjs", "scripts/dev/check_webui_x02.mjs", "scripts/dev/check_webui_x03.mjs", "scripts/dev/check_webui_g1.mjs", "scripts/dev/check_webui_shortcut.mjs", "scripts/dev/check_static_runtime_ux.mjs", "scripts/dev/check_webui_final.mjs"]
